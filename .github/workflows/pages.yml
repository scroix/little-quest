name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Rule tests
        run: cargo test --no-default-features

      - name: Web crate tests
        run: cargo test -p little-quest-web

      - name: Install the wasm-bindgen CLI at the version in Cargo.lock
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, ""); print; exit}' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "=$version" --locked

      - name: Build the site
        run: web/build.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json

      - name: Install Playwright
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Browser tests
        working-directory: web/e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: web/e2e/test-results
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
