<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Little Quest</title>
<meta name="description" content="A short top-down adventure. Find the sword, cross the meadow, clear the dungeon. Plays in the browser with a keyboard or touch.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath fill='%23f8f8f8' d='M7 1h2v9H7z'/%3E%3Cpath fill='%23f8d838' d='M4 10h8v2H4zM7 12h2v3H7z'/%3E%3C/svg%3E">
<link rel="modulepreload" href="./little_quest_web.js?v=__VERSION__">
<link rel="preload" href="./little_quest_web_bg.wasm?v=__VERSION__" as="fetch" type="application/wasm" crossorigin>
<style>
:root {
  --ink: #000;
  --line: #4a5066;
  --gold: #f8d838;
  --chalk: #f8f8f8;
  --cell: clamp(44px, 12vmin, 64px);
  --step: 4px;
  --side: 8px;
  --foot: 8px;
}
/* Clear of the iOS back swipe and home indicator, which a page cannot turn off. */
body.touch { --side: 24px; --foot: 16px; }
@media (orientation: portrait) {
  :root { --cell: clamp(44px, 15.5vmin, 72px); }
}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--ink);
  color: var(--chalk);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "stage stage" "dpad sword";
  padding:
    max(8px, env(safe-area-inset-top))
    max(var(--side), env(safe-area-inset-right))
    max(var(--foot), env(safe-area-inset-bottom))
    max(var(--side), env(safe-area-inset-left));
}
@media (orientation: landscape) {
  #app {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: minmax(0, 1fr);
    grid-template-areas: "dpad stage sword";
  }
}
#stage { grid-area: stage; min-width: 0; min-height: 0; }
#screen {
  position: fixed;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  display: block;
  width: 256px;
  height: 232px;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
}

#dpad, #sword { display: none; }
body.touch #dpad, body.touch #sword { display: grid; }
#dpad {
  grid-area: dpad;
  align-self: center;
  justify-self: start;
  grid-template: repeat(3, var(--cell)) / repeat(3, var(--cell));
  gap: 2px;
  touch-action: none;
}
#sword {
  grid-area: sword;
  align-self: center;
  justify-self: end;
  place-items: center;
  width: calc(var(--cell) * 2.1);
  height: calc(var(--cell) * 2.1);
  touch-action: none;
}
@media (orientation: landscape) {
  #dpad, #sword { align-self: end; }
}

.block {
  position: relative;
  background: var(--line);
  clip-path: polygon(
    var(--step) 0, calc(100% - var(--step)) 0, calc(100% - var(--step)) var(--step),
    100% var(--step), 100% calc(100% - var(--step)), calc(100% - var(--step)) calc(100% - var(--step)),
    calc(100% - var(--step)) 100%, var(--step) 100%, var(--step) calc(100% - var(--step)),
    0 calc(100% - var(--step)), 0 var(--step), var(--step) var(--step));
}
.block::before {
  content: "";
  position: absolute;
  inset: 3px;
  background: var(--ink);
  clip-path: polygon(
    3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px),
    calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px),
    0 calc(100% - 3px), 0 3px, 3px 3px);
}
.block > * { position: relative; }
.block.on { background: var(--gold); }
.block.on::before { background: var(--gold); }

.arm { display: grid; place-items: center; }
.arm::after {
  content: "";
  width: 36%;
  height: 36%;
  background: var(--chalk);
  clip-path: polygon(
    35% 0, 65% 0, 65% 33%, 85% 33%, 85% 66%, 100% 66%, 100% 100%,
    0 100%, 0 66%, 15% 66%, 15% 33%, 35% 33%);
  transition: transform 60ms steps(2);
}
.arm.on::after { background: var(--ink); transform: scale(0.85); }
#up { grid-area: 1 / 2; }
#left { grid-area: 2 / 1; }
#right { grid-area: 2 / 3; }
#down { grid-area: 3 / 2; }
#up::after { rotate: 0deg; }
#right::after { rotate: 90deg; }
#down::after { rotate: 180deg; }
#left::after { rotate: 270deg; }
.hub { grid-area: 2 / 2; opacity: 0.5; }
.hub::before { background: var(--line); inset: 38%; clip-path: none; }

#sword svg { width: 56%; height: 56%; fill: var(--chalk); shape-rendering: crispEdges; }
#sword .gilt { fill: var(--gold); }
#sword.on svg, #sword.on .gilt { fill: var(--ink); }
#sword.on { transform: translateY(2px); }

#fail {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  padding: 24px;
  text-align: center;
  font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace;
}
#fail.show { display: grid; }
#fail p { max-width: 32ch; margin: 0; }
#source {
  position: fixed;
  right: 12px;
  bottom: 8px;
  font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
  color: var(--line);
}
#source:hover, #source:focus-visible { color: var(--chalk); }
body.touch #source { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="screen" width="256" height="232" aria-label="Little Quest game screen"></canvas></div>
  <div id="dpad" role="group" aria-label="Move">
    <div class="block arm" id="up"></div>
    <div class="block arm" id="left"></div>
    <div class="block hub"></div>
    <div class="block arm" id="right"></div>
    <div class="block arm" id="down"></div>
  </div>
  <div id="sword" class="block" role="button" aria-label="Sword">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7" y="1" width="2" height="9"/><rect class="gilt" x="4" y="10" width="8" height="2"/><rect class="gilt" x="7" y="12" width="2" height="3"/></svg>
  </div>
</div>
<a id="source" href="https://github.com/scroix/little-quest">Source</a>
<div id="fail"><p>Little Quest hit a problem. Reload the page, or open it in a current Chrome, Safari, or Firefox.</p></div>
<noscript><p style="padding:24px;font:16px monospace">Little Quest needs JavaScript.</p></noscript>
<script type="module" src="./app.js?v=__VERSION__" onerror="document.getElementById('fail').classList.add('show')"></script>
<script nomodule>document.getElementById('fail').classList.add('show')</script>
</body>
</html>
